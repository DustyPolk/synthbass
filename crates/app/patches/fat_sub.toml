# Deep and heavy but clear: a square with a little saw at the same pitch,
# a clean sine sub underneath, and the filter open enough to keep the note.
version = 2
name = "Fat Sub"

[direct]
drive = 0.4
cutoff_hz = 300.0
resonance = 0.1
envelope_sensitivity = 0.04
level = 0.1

[tracked]
osc1_waveshape = "square"
osc2_waveshape = "saw"
osc2_octave = 0
osc2_detune_cents = 6.0
osc_mix = 0.3
sub_level = 0.5
sub_waveshape = "sine"
cutoff_hz = 400.0
resonance = 0.15
filter_envelope_amount = 0.3
filter_envelope_decay_s = 0.35
pick_sensitivity = 0.4
glide_s = 0.0
level = 0.9

[mix]
dry_level = 0.25
output_level = 1.0
