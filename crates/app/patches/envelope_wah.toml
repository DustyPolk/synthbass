# Mu-Tron-style auto-wah: a resonant filter on the bass itself that opens
# the harder you dig in, with a quiet resonant saw underneath.
version = 2
name = "Envelope Wah"

[direct]
drive = 0.4
cutoff_hz = 150.0
resonance = 0.75
envelope_sensitivity = 0.85
level = 0.8

[tracked]
osc1_waveshape = "saw"
osc2_waveshape = "saw"
osc2_octave = 0
osc2_detune_cents = 6.0
osc_mix = 0.0
sub_level = 0.0
sub_waveshape = "sine"
cutoff_hz = 300.0
resonance = 0.6
filter_envelope_amount = 0.6
filter_envelope_decay_s = 0.25
pick_sensitivity = 0.8
glide_s = 0.0
level = 0.45

[mix]
dry_level = 0.15
output_level = 1.0
